# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
#
# NOTE: written against the classic stdio commandFunction format (still
# used by many published servers as of mid-2026, e.g. glama.ai examples).
# Smithery's docs also describe a newer container/Dockerfile-based deploy
# path — if the web form or `smithery mcp publish` complains, check
# https://smithery.ai/docs/config before adding a Dockerfile; this project
# doesn't need one (pure Python, one PyPI dependency: PyYAML).
startCommand:
  type: stdio
  configSchema:
    type: object
    description: No configuration required — fully local, deterministic, no API key or network access needed.
    properties: {}
  commandFunction:
    |-
    (config) => ({ command: 'guardrail-mcp-server', args: [] })
exampleConfig: {}
